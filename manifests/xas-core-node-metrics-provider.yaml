apiVersion: v1
kind: ServiceAccount
metadata:
  name: xas-core-node-metrics-provider
  namespace: xas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xas-core-node-metrics-provider
rules:
  # Read Pods to scrape them
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read Node metrics from Kubelet
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats", "nodes/proxy"]
    verbs: ["get"]
  # Read Policies to know what to scrape
  - apiGroups: ["xas.io"]
    resources: ["scalingpolicies", "metricproviderclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xas-core-node-metrics-provider
subjects:
  - kind: ServiceAccount
    name: xas-core-node-metrics-provider
    namespace: xas-system
roleRef:
  kind: ClusterRole
  name: xas-core-node-metrics-provider
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: xas.io/v1
kind: MetricProviderClass
metadata:
  name: kubelet
spec:
  type: Kubelet
  config:
    port: "10250"
    path: "/metrics/resource"
---
apiVersion: xas.io/v1
kind: MetricProviderClass
metadata:
  name: prometheus
spec:
  type: Prometheus
  config:
    port: "8080"
    path: "/metrics"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xas-core-node-metrics-provider
  namespace: xas-system
spec:
  selector:
    matchLabels:
      app: xas-core-node-metrics-provider
  template:
    metadata:
      labels:
        app: xas-core-node-metrics-provider
    spec:
      serviceAccountName: xas-core-node-metrics-provider
      containers:
        - name: provider
          image: ko://github.com/gke-labs/extensible-workload-autoscaler/cmd/core-node-metrics-provider
          args:
            - "--server-address=xas-server.xas-system.svc.cluster.local:80"
            - "--node-name=$(NODE_NAME)"
            - "--cluster-name=default"
            - "--debug"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
