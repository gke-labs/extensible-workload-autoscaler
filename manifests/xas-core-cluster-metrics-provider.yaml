apiVersion: v1
kind: ServiceAccount
metadata:
  name: xas-core-cluster-metrics-provider
  namespace: xas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xas-core-cluster-metrics-provider
rules:
  - apiGroups: ["external.metrics.k8s.io", "custom.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list"]
  - apiGroups: ["xas.io"]
    resources: ["metricproviderclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xas-core-cluster-metrics-provider
subjects:
  - kind: ServiceAccount
    name: xas-core-cluster-metrics-provider
    namespace: xas-system
roleRef:
  kind: ClusterRole
  name: xas-core-cluster-metrics-provider
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: xas.io/v1
kind: MetricProviderClass
metadata:
  name: k8s-external-metrics
spec:
  type: ExternalMetrics
  config:
    group: "external.metrics.k8s.io"
---
apiVersion: xas.io/v1
kind: MetricProviderClass
metadata:
  name: k8s-custom-metrics
spec:
  type: CustomMetrics
  config:
    group: "custom.metrics.k8s.io"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xas-core-cluster-metrics-provider
  namespace: xas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xas-core-cluster-metrics-provider
  template:
    metadata:
      labels:
        app: xas-core-cluster-metrics-provider
    spec:
      serviceAccountName: xas-core-cluster-metrics-provider
      containers:
        - name: provider
          image: ko://github.com/gke-labs/extensible-workload-autoscaler/cmd/core-cluster-metrics-provider
          args:
            - "--server-address=xas-server.xas-system.svc.cluster.local:80"
            - "--cluster-name=default"
            - "--debug"
