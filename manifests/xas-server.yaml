apiVersion: v1
kind: Namespace
metadata:
  name: xas-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xas-server
  namespace: xas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xas-server
  template:
    metadata:
      labels:
        app: xas-server
    spec:
      containers:
        - name: server
          image: ko://github.com/gke-labs/extensible-workload-autoscaler/cmd/server
          args:
            - "--debug"
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: xas-server
  namespace: xas-system
spec:
  selector:
    app: xas-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xas-controller
  namespace: xas-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xas-controller
rules:
  # Read and update replica count via the /scale subresource
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["*"]
    resources: ["*/scale"]
    verbs: ["get", "update", "patch"]
  # Read Pods for workload sync and delete for eviction fallback
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Patch pod resize subresource for in-place VPA
  - apiGroups: [""]
    resources: ["pods/resize"]
    verbs: ["patch"]
  # Manage ScalingPolicies and read Classes
  - apiGroups: ["xas.io"]
    resources: ["scalingpolicies", "metricproviderclasses", "recommenderclasses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["xas.io"]
    resources: ["scalingpolicies/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xas-controller
subjects:
  - kind: ServiceAccount
    name: xas-controller
    namespace: xas-system
roleRef:
  kind: ClusterRole
  name: xas-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xas-controller
  namespace: xas-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xas-controller
  template:
    metadata:
      labels:
        app: xas-controller
    spec:
      serviceAccountName: xas-controller
      containers:
        - name: controller
          image: ko://github.com/gke-labs/extensible-workload-autoscaler/cmd/controller
          args:
            - "--server-address=xas-server.xas-system.svc.cluster.local:80"
            - "--cluster-name=default"
            - "--debug"
