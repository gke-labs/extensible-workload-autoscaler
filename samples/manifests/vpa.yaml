apiVersion: v1
kind: Namespace
metadata:
  name: sample-vpa
  labels:
    sample: vpa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-vpa-app
  namespace: sample-vpa
  labels:
    sample: vpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-vpa-app
  template:
    metadata:
      labels:
        app: sample-vpa-app
    spec:
      containers:
        - name: stress
          image: vish/stress
          imagePullPolicy: IfNotPresent
          args: ["-cpus", "1"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # In-place resource resize policies (Kubernetes 1.27+)
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
---
apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: sample-vpa-policy
  namespace: sample-vpa
  labels:
    sample: vpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-vpa-app
  minReplicas: 1
  maxReplicas: 5

  # VPA creates the metrics it needs: for CPU and memory, the P90 of the usage
  # as the target, and the P50 and P99 as the bounds. Pods whose requests fall
  # outside [P50, P99] are resized. Pods within these bounds are only resized
  # when some request changes by at least 10%.
  # The limits keep the pods' limit/request ratio (here 5x CPU, 4x memory, from
  # the template); set cpu-limit-ratio / mem-limit-ratio to override it.
  scaling:
    - recommender: "vpa"
      name: "vpa-sizing"
      params:
        container: "stress"
        cpu-safety-margin: "1.10"
        mem-safety-margin: "1.10"
