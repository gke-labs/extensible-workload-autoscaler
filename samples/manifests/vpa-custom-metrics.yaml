apiVersion: v1
kind: Namespace
metadata:
  name: sample-vpa-custom
  labels:
    sample: vpa-custom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-vpa-custom-app
  namespace: sample-vpa-custom
  labels:
    sample: vpa-custom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-vpa-custom-app
  template:
    metadata:
      labels:
        app: sample-vpa-custom-app
    spec:
      containers:
        - name: stress
          image: vish/stress
          imagePullPolicy: IfNotPresent
          args: ["-cpus", "1"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # In-place resource resize policies (Kubernetes 1.27+)
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
---
apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: sample-vpa-custom-policy
  namespace: sample-vpa-custom
  labels:
    sample: vpa-custom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-vpa-custom-app
  minReplicas: 1
  maxReplicas: 5

  # The CPU target is the P95 of the usage, with a shorter half-life. VPA
  # creates the other metrics it needs: the CPU bounds (P50 and P99) with the
  # same source, half-life and bucket size as cpu_p95, and the memory target
  # and bounds (P90, P50 and P99) with the defaults.
  metrics:
    - name: "cpu_p95"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "cpu"
      decayingDistribution:
        percentile: "p95"
        halfLife: "12h"
        bucketSize: "0.05"

  scaling:
    - recommender: "vpa"
      name: "vpa-sizing"
      params:
        container: "stress"
        cpu-metric: "cpu_p95"
        # Setting a metric param only controls that resource by default.
        controlled-resources: "cpu,memory"
        cpu-safety-margin: "1.10"
        mem-safety-margin: "1.10"
