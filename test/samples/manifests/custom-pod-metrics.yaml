apiVersion: v1
kind: Namespace
metadata:
  name: sample-custom-pod-metrics
  labels:
    sample: custom-pod-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-pod-consumer
  namespace: sample-custom-pod-metrics
  labels:
    sample: custom-pod-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-pod-consumer
  template:
    metadata:
      labels:
        app: custom-pod-consumer
    spec:
      containers:
        - name: sample-app
          image: xas-sample:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: custom-pod-metrics
  namespace: sample-custom-pod-metrics
  labels:
    sample: custom-pod-metrics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: custom-pod-consumer
  minReplicas: 1
  maxReplicas: 10

  metrics:
    - name: "pod_http_requests"
      provider: "k8s-custom-metrics"
      params:
        targetKind: "Pod"
        metric: "http_requests_per_second"
        selector: "app=custom-pod-consumer"
      gauge:
        aggregation: "Avg"

  scaling:
    - recommender: "linear"
      name: "requests_per_pod_target"
      params:
        metric: "pod_http_requests"
        target: "100.0" # Target 100 req/sec per pod
