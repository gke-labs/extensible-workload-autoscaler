apiVersion: v1
kind: Namespace
metadata:
  name: sample-vpa
  labels:
    sample: vpa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-vpa-app
  namespace: sample-vpa
  labels:
    sample: vpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-vpa-app
  template:
    metadata:
      labels:
        app: sample-vpa-app
    spec:
      containers:
        - name: stress
          image: vish/stress
          imagePullPolicy: IfNotPresent
          args: ["-cpus", "1"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # In-place resource resize policies (Kubernetes 1.27+)
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
---
apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: sample-vpa-policy
  namespace: sample-vpa
  labels:
    sample: vpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sample-vpa-app
  minReplicas: 1
  maxReplicas: 5

  # The target is the P90 of the usage. Pods whose requests fall outside
  # [P50, P99] are resized. Pods within these bounds are only resized when
  # some request changes by at least 10%.
  metrics:
    - name: "cpu_p50"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "cpu"
      decayingDistribution:
        percentile: "p50"
        halfLife: "24h"
        bucketSize: "0.05"
    - name: "cpu_p90"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "cpu"
      decayingDistribution:
        percentile: "p90"
        halfLife: "24h"
        bucketSize: "0.05"
    - name: "cpu_p99"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "cpu"
      decayingDistribution:
        percentile: "p99"
        halfLife: "24h"
        bucketSize: "0.05"
    - name: "mem_p50"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "memory"
      decayingDistribution:
        percentile: "p50"
        halfLife: "24h"
        bucketSize: "10485760"
    - name: "mem_p90"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "memory"
      decayingDistribution:
        percentile: "p90"
        halfLife: "24h"
        bucketSize: "10485760"
    - name: "mem_p99"
      scope: PodContainer
      provider: "kubelet"
      params:
        type: "memory"
      decayingDistribution:
        percentile: "p99"
        halfLife: "24h"
        bucketSize: "10485760"

  scaling:
    - recommender: "vpa"
      name: "vpa-sizing"
      params:
        container: "stress"
        cpu-metric: "cpu_p90"
        cpu-lower-bound-metric: "cpu_p50"
        cpu-upper-bound-metric: "cpu_p99"
        mem-metric: "mem_p90"
        mem-lower-bound-metric: "mem_p50"
        mem-upper-bound-metric: "mem_p99"
        cpu-safety-margin: "1.10"
        mem-safety-margin: "1.10"
