apiVersion: v1
kind: Namespace
metadata:
  name: sample-per-pod-vertical
  labels:
    sample: per-pod-vertical
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: per-pod-consumer
  namespace: sample-per-pod-vertical
  labels:
    sample: per-pod-vertical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: per-pod-consumer
  template:
    metadata:
      labels:
        app: per-pod-consumer
    spec:
      containers:
        - name: main
          image: xas-sample:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AUTO_PER_POD_LOAD
              value: "true"
          resources:
            requests:
              cpu: "500m"
            limits:
              cpu: "2000m"
---
apiVersion: xas.io/v1
kind: ScalingPolicy
metadata:
  name: per-pod-vertical-sample
  namespace: sample-per-pod-vertical
  labels:
    sample: per-pod-vertical
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: per-pod-consumer
  minReplicas: 1
  maxReplicas: 10

  metrics:
    - name: "pod_cpu_usage"
      provider: "kubelet"
      scope: "Pod"
      params:
        type: "cpu"
        mode: "usage"
      gauge:
        aggregation: "Avg"

  scaling:
    - recommender: "per-pod-vertical"
      name: "cpu_vpa"
      params:
        metric: "pod_cpu_usage"
        target: "2.5"       # Target 2.5 CPU cores per pod
        safetyMargin: "1.2" # 20% headroom
        container: "main"   # Target container name
        minCpu: "100m"     # Floor bound per pod
        maxCpu: "1800m"    # Ceiling bound per pod
