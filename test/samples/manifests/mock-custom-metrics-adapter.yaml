# A mock custom metrics adapter to test xAS with custom metrics (custom.metrics.k8s.io).
# Deploy with: kubectl apply -f test/samples/manifests/mock-custom-metrics-adapter.yaml
#
# Generate load for Pod Metric (pod_http_requests):
# kubectl exec -n mock-custom-metrics deploy/mock-custom-adapter -- python3 -c "import urllib.request, ssl; ctx = ssl._create_unverified_context(); urllib.request.urlopen('https://localhost:443/set_pod_requests=250', context=ctx)"
#
# Generate load for Object Metric (service_http_requests):
# kubectl exec -n mock-custom-metrics deploy/mock-custom-adapter -- python3 -c "import urllib.request, ssl; ctx = ssl._create_unverified_context(); urllib.request.urlopen('https://localhost:443/set_service_requests=800', context=ctx)"

apiVersion: v1
kind: Namespace
metadata:
  name: mock-custom-metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-custom-adapter
  namespace: mock-custom-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mock-custom-adapter
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mock-custom-adapter
subjects:
  - kind: ServiceAccount
    name: mock-custom-adapter
    namespace: mock-custom-metrics
roleRef:
  kind: ClusterRole
  name: mock-custom-adapter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-custom-adapter
  namespace: mock-custom-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-custom-adapter
  template:
    metadata:
      labels:
        app: mock-custom-adapter
    spec:
      serviceAccountName: mock-custom-adapter
      containers:
        - name: mock-custom-adapter
          image: python:3.9-slim
          command: ["sh", "-c"]
          args:
            - |
              openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem -days 365 -nodes -subj "/CN=mock-custom-adapter.mock-custom-metrics.svc"
              python3 -c "
              import http.server, ssl, json, time, urllib.request

              pod_requests = 20
              service_requests = 100

              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      global pod_requests, service_requests

                      if '/set_pod_requests=' in self.path:
                          pod_requests = int(self.path.split('=')[1])
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(f'Updated pod_requests to {pod_requests}\n'.encode())
                          return

                      if '/set_service_requests=' in self.path:
                          service_requests = int(self.path.split('=')[1])
                          self.send_response(200)
                          self.end_headers()
                          self.wfile.write(f'Updated service_requests to {service_requests}\n'.encode())
                          return

                      # Handle Pod Metric Query: /apis/custom.metrics.k8s.io/v1beta2/namespaces/{ns}/pods/*/{metric}
                      if '/pods/' in self.path or '/pods*' in self.path:
                          pod_names = []
                          try:
                              token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
                              req = urllib.request.Request('https://kubernetes.default.svc/api/v1/namespaces/sample-custom-pod-metrics/pods', headers={'Authorization': 'Bearer ' + token})
                              ctx = ssl._create_unverified_context()
                              res = urllib.request.urlopen(req, context=ctx)
                              pods = json.loads(res.read().decode())['items']
                              pod_names = [p['metadata']['name'] for p in pods]
                          except Exception as e:
                              pass

                          items = []
                          for pod_name in pod_names:
                              items.append({
                                  'describedObject': {
                                      'kind': 'Pod',
                                      'name': pod_name,
                                      'namespace': 'sample-custom-pod-metrics',
                                      'apiVersion': 'v1'
                                  },
                                  'metric': {
                                      'name': 'http_requests_per_second'
                                  },
                                  'timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                                  'value': str(pod_requests)
                              })

                          res = {
                              'kind': 'MetricValueList',
                              'apiVersion': 'custom.metrics.k8s.io/v1beta2',
                              'metadata': {},
                              'items': items
                          }
                          self.send_response(200)
                          self.send_header('Content-Type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps(res).encode())
                          return

                      # Handle Object Metric Query: /apis/custom.metrics.k8s.io/v1beta2/namespaces/{ns}/{kind}/{name}/{metric}
                      res = {
                          'kind': 'MetricValueList',
                          'apiVersion': 'custom.metrics.k8s.io/v1beta2',
                          'metadata': {},
                          'items': [
                              {
                                  'describedObject': {
                                      'kind': 'Service',
                                      'name': 'custom-object-service',
                                      'namespace': 'sample-custom-object-metrics',
                                      'apiVersion': 'v1'
                                  },
                                  'metric': {
                                      'name': 'http_requests_per_second'
                                  },
                                  'timestamp': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                                  'value': str(service_requests)
                              }
                          ]
                      }
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps(res).encode())

              httpd = http.server.HTTPServer(('0.0.0.0', 443), Handler)
              ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              ctx.load_cert_chain(certfile='/tmp/cert.pem', keyfile='/tmp/key.pem')
              httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
              httpd.serve_forever()
              "
          ports:
            - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: mock-custom-adapter
  namespace: mock-custom-metrics
spec:
  ports:
    - port: 443
      targetPort: 443
  selector:
    app: mock-custom-adapter
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta2.custom.metrics.k8s.io
spec:
  service:
    name: mock-custom-adapter
    namespace: mock-custom-metrics
    port: 443
  group: custom.metrics.k8s.io
  version: v1beta2
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
